// --- AGREGA ESTO AL PRINCIPIO DEL ARCHIVO ---
buildscript {
    // Define tu versión de Kotlin aquí (si no la sabes, prueba con 1.8.10 o 1.7.10)
    ext.kotlin_version = '1.8.10' 
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Estas dos líneas son estándar para que funcione Android y Kotlin
        classpath 'com.android.tools.build:gradle:7.3.0' // O la versión que tuvieras
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        
        // --- ESTA ES LA LÍNEA QUE PIDE FIREBASE ---
        classpath 'com.google.gms:google-services:4.4.4'
        // -----------------------------------------
    }
}
// -------------------------------------------
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
